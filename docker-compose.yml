# Compose variables are provided through the environment (or an env file), so
# no sensitive value is ever committed:
#   POSTGRES_USER      (default: darthub)
#   POSTGRES_PASSWORD  (required, no default — compose fails fast without it)
#   POSTGRES_DB        (default: darthub)
#   AUTH_SECRET        (required, no default — compose fails fast without it)
#
# AUTH_SECRET signs the session tokens (src/auth/session.ts) and the Auth.js
# cookies (src/auth/nextauth.ts). Generate one with `openssl rand -base64 32`
# and keep it out of the repository. Without it the application cannot issue or
# verify a session, so every sign-in fails — compose refuses to start instead.

name: darthub

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    ports:
      # Bound to the loopback address of the host. The application is
      # reached through the reverse proxy; publishing the port on every
      # interface would offer a second way in that bypasses the proxy — and
      # with it the client address the rate limiter counts on.
      #
      # This does not touch the path the proxy takes: the proxy reaches the
      # container across the Docker bridge (172.18.0.2:3000), and the
      # container binds every interface inside its own network namespace
      # (HOSTNAME=0.0.0.0 in the Dockerfile). Only the *published* host
      # port is restricted here.
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-darthub}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in the environment}@postgres:5432/${POSTGRES_DB:-darthub}"
      # Signs the session tokens and the Auth.js cookies. Required: without
      # it no session can be issued or verified, so every sign-in fails.
      AUTH_SECRET: "${AUTH_SECRET:?AUTH_SECRET must be set in the environment}"
      # The counter store of the rate limiter (src/security). The redis
      # service below is a hard dependency of the app, so the URL is always
      # known and the limits are counted across the whole deployment.
      REDIS_URL: "redis://redis:6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-darthub}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in the environment}"
      POSTGRES_DB: "${POSTGRES_DB:-darthub}"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-darthub} -d $${POSTGRES_DB:-darthub}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Future task 009 (realtime Socket.IO server): add a second Node service
  # alongside `app`, e.g.:
  #
  #   realtime:
  #     build:
  #       context: .
  #       dockerfile: Dockerfile.realtime
  #     restart: unless-stopped
  #     ports:
  #       - "3001:3001"
  #     environment:
  #       DATABASE_URL: "postgresql://${POSTGRES_USER:-darthub}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in the environment}@postgres:5432/${POSTGRES_DB:-darthub}"
  #     depends_on:
  #       postgres:
  #         condition: service_healthy
  #
  # The postgres service and DATABASE_URL wiring above are shared, so nothing
  # else needs to change.

volumes:
  postgres-data:
  redis-data:
