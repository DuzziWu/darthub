name: Production Deployment

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: darthub-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: [self-hosted, Linux, X64, darthub-deploy]
    timeout-minutes: 30

    steps:
      - name: Deploy tested main commit
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          "$HOME/darthub-deploy/deploy.sh" "$DEPLOY_SHA"
